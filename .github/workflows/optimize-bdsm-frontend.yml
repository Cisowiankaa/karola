name: Optimize BDSM frontend stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-bdsm-frontend.yml'
      - 'bdsm-app/optimize-build.py'
      - 'bdsm-app/*.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stable BDSM frontend
        run: python3 bdsm-app/optimize-build.py
      - name: Inject extra runtime modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('bdsm-app/index.html')
          text = index.read_text(encoding='utf-8')
          modules = [
              ('bdsm-app/month-calendar-status-v2.js','window.__bdsmMonthCalendarStatusV2Installed'),
              ('bdsm-app/global-search-module.js','window.__bdsmGlobalSearchInstalled'),
              ('bdsm-app/activity-center-module.js','window.__bdsmActivityCenterInstalled'),
          ]
          for path, marker in modules:
              if marker in text:
                  continue
              module = Path(path).read_text(encoding='utf-8')
              text = text.replace('</body>', '<script>\n' + module + '\n</script>\n</body>')
          index.write_text(text, encoding='utf-8')
          PY
      - name: Commit optimized index
        run: |
          if git diff --quiet -- bdsm-app/index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Optimize BDSM frontend runtime'
          git push
