name: Promote central invite status
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-invite-status-central.yml'
      - 'bdsm-app/invite-status-central.js'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add central invite status script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bdsm-app/index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/invite-status-central.js?v=20260824-2030"></script>'
          if tag not in text:
              text=text.replace('</body>',tag+'\n</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Load central invite status client'
          git push
