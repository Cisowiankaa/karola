name: Optimize BDSM frontend
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-invite-status-central.yml'
      - 'bdsm-app/optimize-build.py'
      - 'bdsm-app/sync-fix-v3.js'
      - 'bdsm-app/invite-status-central.js'
      - 'bdsm-app/email-panel-force-open.js'
      - 'bdsm-app/offences-module.js'
      - 'bdsm-app/deadlines-module.js'
      - 'bdsm-app/education-tasks-module.js'
      - 'bdsm-app/education-library-module.js'
      - 'bdsm-app/written-notes-module.js'
      - 'bdsm-app/relationship-timeline-module.js'
      - 'bdsm-app/case-controls-module.js'
      - 'bdsm-app/today-dashboard-module.js'
      - 'bdsm-app/weekly-plan-module.js'
      - 'bdsm-app/month-calendar-module.js'
      - 'bdsm-app/day-agenda-module.js'
      - 'bdsm-app/agenda-cloud-sync-module.js'
      - 'bdsm-app/hourly-reports-module.js'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stable BDSM frontend
        run: python3 bdsm-app/optimize-build.py
      - name: Commit optimized index
        run: |
          if git diff --quiet -- bdsm-app/index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Optimize BDSM frontend runtime'
          git push
