name: Promote BDSM Sync V3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-bdsm-sync-v2.yml'
      - 'bdsm-app/sync-fix-v3.js'
      - 'bdsm-app/invite-status-central.js'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh BDSM script cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bdsm-app/index.html')
          text = p.read_text(encoding='utf-8')
          import re
          text, n1 = re.subn(r'https://cdn\.jsdelivr\.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3\.js\?v=[^"\']+', 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3.js?v=20260824-2124', text)
          text, n2 = re.subn(r'https://cdn\.jsdelivr\.net/gh/Cisowiankaa/karola@main/bdsm-app/invite-status-central\.js\?v=[^"\']+', 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/invite-status-central.js?v=20260824-2124', text)
          if not n1 or not n2:
              raise SystemExit(f'Expected script references not found: sync={n1}, invite={n2}')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Refresh BDSM frontend script versions'
          git push
