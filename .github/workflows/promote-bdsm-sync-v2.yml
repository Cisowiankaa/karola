name: Promote BDSM Sync V2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-bdsm-sync-v2.yml'
      - 'bdsm-app/sync-fix-v2.js'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch BDSM app to sync-fix-v2
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bdsm-app/index.html')
          text = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/Cisowiankaa/karola/main/bdsm-app/sync-fix.js'
          new = 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v2.js?v=20260824-2012'
          if old in text:
              p.write_text(text.replace(old, new), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected sync script reference not found')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Use stable BDSM sync v2 client'
          git push
