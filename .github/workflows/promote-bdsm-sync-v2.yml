name: Promote BDSM Sync V3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-bdsm-sync-v2.yml'
      - 'bdsm-app/sync-fix-v3.js'
      - 'bdsm-app/invite-status-central.js'
      - 'bdsm-app/email-panel-force-open.js'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh BDSM script cache versions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('bdsm-app/index.html')
          text = p.read_text(encoding='utf-8')
          replacements = [
            (r'https://cdn\.jsdelivr\.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3\.js\?v=[^"\']+', 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3.js?v=20260824-2128'),
            (r'https://cdn\.jsdelivr\.net/gh/Cisowiankaa/karola@main/bdsm-app/invite-status-central\.js\?v=[^"\']+', 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/invite-status-central.js?v=20260824-2128'),
            (r'https://cdn\.jsdelivr\.net/gh/Cisowiankaa/karola@main/bdsm-app/email-panel-force-open\.js\?v=[^"\']+', 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/email-panel-force-open.js?v=20260824-2128')
          ]
          counts=[]
          for pattern,new in replacements:
              text,n=re.subn(pattern,new,text)
              counts.append(n)
          if not all(counts):
              raise SystemExit(f'Expected script references not found: {counts}')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Refresh BDSM frontend script versions'
          git push
