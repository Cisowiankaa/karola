name: Promote BDSM Sync V3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-bdsm-sync-v2.yml'
      - 'bdsm-app/sync-fix-v3.js'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh BDSM sync v3 cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bdsm-app/index.html')
          text = p.read_text(encoding='utf-8')
          old_versions = [
              'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3.js?v=20260824-2020',
              'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3.js?v=20260824-2042'
          ]
          new = 'https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/sync-fix-v3.js?v=20260824-2058'
          for old in old_versions:
              if old in text:
                  text = text.replace(old, new)
          if new not in text:
              raise SystemExit('Expected sync v3 reference not found')
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Refresh BDSM sync v3 cache version'
          git push
