name: BDSM sync v3 self-test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdsm-sync-v2-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST healthcheck to Make v3
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST 'https://hook.eu1.make.com/1e7vxw98nlgw8r6fqdwrq0nxhg4mubi7' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"action":"healthcheck","requestId":"GITHUB-V3-'"$(date +%s)"'"}')
          cat response.txt || true
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 300
