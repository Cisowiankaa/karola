name: BDSM sync v2 self-test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdsm-sync-v2-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST safe empty sync to Make v2
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST 'https://hook.eu1.make.com/b5wib2471u7oqypl5qrqvmrj33hqwhkc' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"action":"sync","requestId":"GITHUB-SELFTEST-'"$(date +%s)"'","accountId":"ACC-SYSTEM-SELFTEST","events":[],"rules":{},"accessList":[],"clientTime":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}')
          cat response.txt || true
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 300
