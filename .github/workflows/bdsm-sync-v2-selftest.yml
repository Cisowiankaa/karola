name: BDSM private sync healthcheck

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdsm-sync-v2-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST healthcheck to Make private space
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST 'https://hook.eu1.make.com/i3ukjt21q17182dkudll76bh4p5s51ry' \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data '{"action":"healthcheck","requestId":"GITHUB-PRIVATE-'"$(date +%s)"'"}')
          cat response.txt || true
          echo "HTTP $code"
          test "$code" -ge 200 -a "$code" -lt 300
