name: Attach BDSM sync fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdsm-inject-sync-fix.yml'
      - 'bdsm-app/sync-fix.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach resilient sync handler
        shell: bash
        run: |
          set -e
          FILE='bdsm-app/index.html'
          TAG='<script src="https://raw.githubusercontent.com/Cisowiankaa/karola/main/bdsm-app/sync-fix.js"></script>'
          if grep -Fq 'sync-fix.js' "$FILE"; then
            echo 'sync-fix already attached'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('bdsm-app/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="https://raw.githubusercontent.com/Cisowiankaa/karola/main/bdsm-app/sync-fix.js"></script>'
          if 'sync-fix.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing </body>')
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'Attach resilient BDSM sync handler'
          git push
