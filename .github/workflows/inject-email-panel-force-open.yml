name: Inject BDSM Email Panel Force Open
on:
  push:
    branches: [main]
    paths:
      - 'bdsm-app/email-panel-force-open.js'
      - '.github/workflows/inject-email-panel-force-open.yml'
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject force-open script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('bdsm-app/index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="https://cdn.jsdelivr.net/gh/Cisowiankaa/karola@main/bdsm-app/email-panel-force-open.js?v=20260824-2105"></script>'
          if tag not in text:
              text=text.replace('</body>',tag+'\n</body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bdsm-app/index.html
          git commit -m 'Load email panel force-open fix'
          git push
