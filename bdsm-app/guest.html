<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zaproszenie – BDSM App</title><style>*{box-sizing:border-box}body{margin:0;background:#090d16;color:#f5f7fb;font-family:Inter,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.box{width:min(560px,100%);background:#111724;border:1px solid #263044;border-radius:16px;padding:24px}h1{margin-top:0}.muted{color:#9aa6b8}input,textarea{width:100%;margin:6px 0;background:#0c121c;border:1px solid #303b50;color:#fff;border-radius:9px;padding:11px}button{width:100%;margin-top:10px;background:#8b45c7;border:0;color:#fff;padding:12px;border-radius:10px;cursor:pointer;font-weight:700}.ok{color:#69d58a}.err{color:#ff8d8d}</style></head><body><main class="box"><h1>Dodaj wpis</h1><p class="muted">Masz zaproszenie do dodania informacji. Nie otrzymujesz dostępu do prywatnej części aplikacji.</p><input id="name" maxlength="80" placeholder="Twoje imię / pseudonim"><input id="title" maxlength="160" placeholder="Tytuł"><input id="date" type="datetime-local"><textarea id="note" maxlength="2000" rows="5" placeholder="Opis / informacja"></textarea><button id="send">Dodaj na stronę</button><p id="msg"></p></main><script>
const SUPA='https://ygesxujnjruplqoqgvpy.supabase.co',KEY='sb_publishable_mAAREnT3ube6bTSDnv5l0Q_15fvGh7X',token=new URLSearchParams(location.search).get('invite');
send.onclick=async()=>{msg.className='';msg.textContent='';if(!token)return msg.textContent='Brak tokenu zaproszenia.';if(!name.value.trim()||!title.value.trim())return msg.textContent='Wpisz imię i tytuł.';send.disabled=true;try{const r=await fetch(SUPA+'/rest/v1/rpc/bdsm_guest_submit',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token,p_guest_name:name.value.trim(),p_title:title.value.trim(),p_note:note.value.trim(),p_event_date:date.value?new Date(date.value).toISOString():null})});if(!r.ok)throw new Error((await r.json()).message||'Nie udało się dodać wpisu');msg.className='ok';msg.textContent='✓ Wpis został dodany.';title.value='';note.value='';date.value=''}catch(e){msg.className='err';msg.textContent=e.message}finally{send.disabled=false}};
</script></body></html>
